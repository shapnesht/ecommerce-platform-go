version: "1"

services:
  postgres:
    image: postgres:12-alpine
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce-shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  cdn:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../uploads:/var/www/uploads
    depends_on:
      - localstack

  localstack:
    image: localstack/localstack
    container_name: localstack_container
    ports:
      - '4566:4566' # LocalStack Gateway
    environment:
      - SERVICES= s3, sqs
      - DEFAULT_REGION= us-east-1
      - DATA_DIR= /tmp/localstack/data
      - AWS_ACCESS_KEY= ls-bOqozage-1462-JEDa-woxA-kUguvuVId4d1
      - LOCALSTACK_AUTH_TOKEN= ls-bOqozage-1462-JEDa-woxA-kUguvuVId4d1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./init/aws/init-localstack.sh:/etc/localstack/init/ready.d/init.sh

volumes:
  localstack_data:
  postgres_data: